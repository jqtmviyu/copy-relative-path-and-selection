name: Package VSIX

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve version and filename
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_VERSION=$(node -p "require('./extension/package.json').version")
          REF_NAME="${GITHUB_REF_NAME:-}"
          TAG_VERSION=""

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG_VERSION="${REF_NAME#v}"
          fi

          VERSION="${TAG_VERSION:-$PACKAGE_VERSION}"
          FILE_NAME="copy-relative-path-and-selection-v${VERSION}.vsix"

          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"

      - name: Apply tag version to extension package
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs = require("fs"); const path = "./extension/package.json"; const pkg = JSON.parse(fs.readFileSync(path, "utf8")); pkg.version = process.env.VERSION; fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");'
        env:
          VERSION: ${{ steps.meta.outputs.version }}

      - name: Install extension dependencies
        shell: bash
        working-directory: extension
        run: |
          set -euo pipefail
          npm ci

      - name: Build VSIX with vsce
        shell: bash
        working-directory: extension
        run: |
          set -euo pipefail
          npx vsce package --out "../${{ steps.meta.outputs.file_name }}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.file_name }}
          path: ${{ steps.meta.outputs.file_name }}
          if-no-files-found: error

      # - name: Publish to Visual Studio Marketplace
      #   if: github.ref_type == 'tag'
      #   shell: bash
      #   working-directory: extension
      #   env:
      #     VSCE_PAT: ${{ secrets.VSCE_PAT }}
      #   run: |
      #     set -euo pipefail
      #     npx vsce publish --packagePath "../${{ steps.meta.outputs.file_name }}"

      - name: Upload VSIX to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.meta.outputs.file_name }}
